{% extends "base.html" %}
{% block title %}Confirm Handover{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 0 auto;">
    <div class="card" style="text-align: center;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; margin: 0 auto 16px;">&#10003;</div>
        <h1 style="font-size: 18px;">Confirm you received this item</h1>
        <p class="helptext">{{ reservation.asset.title }}, from {{ reservation.asset.owner.username }}</p>
        <p class="helptext">Only confirm once you physically have the item in hand.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" style="width: 100%; text-align: center;">Confirm receipt</button>
        </form>
    </div>
</div>
{% endblock %}
