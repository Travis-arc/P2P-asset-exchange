{% extends "base.html" %}
{% block title %}Delete Listing{% endblock %}
{% block content %}
<div style="max-width: 440px; margin: 0 auto;">
    <div class="card" style="text-align: center;">
        <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--red-bg); color: var(--red); display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 16px;">!</div>
        <h1 style="font-size: 18px;">Delete "{{ asset.title }}"?</h1>
        <p class="helptext">This can't be undone.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" style="width: 100%; text-align: center; background: var(--red);">Yes, delete it</button>
        </form>
        <a class="btn" href="{% url 'listings:asset_detail' asset.pk %}" style="width: 100%; text-align: center; margin-top: 10px; background: var(--surface); color: var(--text); border: 1px solid var(--border-strong);">Cancel</a>
    </div>
</div>
{% endblock %}
